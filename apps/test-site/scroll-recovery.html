<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Scroll recovery fixtures</title>
<style>
  body { margin: 0; min-height: 1200px; }
  #target { position: absolute; left: 40px; top: 520px; width: 180px; height: 40px; }
  #cover { position: fixed; bottom: 0; left: 0; width: 300px; height: 120px; z-index: 10; background: #ddd; }
</style>
<button id="target">Target</button><div id="cover">Cover</div>
<script>
  const mode = new URLSearchParams(location.search).get('mode');
  const target = document.getElementById('target');
  const cover = document.getElementById('cover');
  if (mode === 'healthy') cover.remove();
  if (mode === 'no-scroll' || mode === 'nested' || mode === 'horizontal') document.body.style.minHeight = '600px';
  if (mode === 'fixed-fixed') target.style.position = 'fixed';
  if (mode === 'reverse-endpoint') {
    target.style.top = '620px'; cover.style.position = 'sticky'; cover.style.top = '0'; cover.style.bottom = 'auto';
    scrollTo(0, 10000);
  }
  if (mode === 'nested') {
    const scroller = document.createElement('div'); scroller.id = 'scroller';
    scroller.style.cssText = 'position:absolute;left:0;top:50px;width:350px;height:500px;overflow:auto';
    const content = document.createElement('div'); content.style.cssText = 'position:relative;height:1000px';
    target.style.top = '450px'; content.append(target); scroller.append(content); document.body.append(scroller);
  }
  if (mode === 'horizontal') {
    document.body.style.minWidth = '1600px'; target.style.left = '720px'; target.style.top = '200px'; target.style.width = '60px';
    cover.style.cssText = 'position:fixed;left:auto;bottom:auto;right:0;top:0;width:120px;height:600px;z-index:10;background:#ddd';
  }
  if (mode === 'replace' || mode === 'rebind' || mode === 'resize-target') addEventListener('scroll', () => {
    if (mode === 'replace') target.replaceWith(target.cloneNode(true));
    if (mode === 'rebind') target.dataset.recordId = 'another-record';
    if (mode === 'resize-target') target.style.width = '200px';
  }, { once: true });
  if (mode === 'restore-failed') {
    let moved = false;
    addEventListener('scroll', () => { if (scrollY > 0) moved = true; else if (moved) scrollTo(0, 100); });
  }
</script>
</html>
