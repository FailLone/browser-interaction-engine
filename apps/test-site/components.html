<!doctype html><html lang="en"><meta charset="utf-8"><title>Component evidence fixture</title>
<style>body{font:16px sans-serif;padding:30px}.picker{position:relative;display:inline-block;cursor:pointer;margin:20px}.panel{display:none;position:absolute;top:30px;left:0;background:white;border:1px solid;padding:12px;width:220px;z-index:5}.list{position:relative}.rating button{border:0;background:none;font-size:30px;color:#bbb}.rating button.active{color:#ea0}.other{margin-top:240px}</style>
<h1>Component evidence</h1>
<section aria-label="First selection"><div class="picker"><div>Alpha</div><div class="panel"><div><input aria-label="Search choices"><div class="list" role="listbox"><div role="option">Alpha</div><div role="option">Beta</div></div></div></div></div></section>
<section aria-label="Second selection"><div class="picker"><div>Gamma</div><div class="panel"><div><input aria-label="Search choices"><div class="list" role="listbox"><div role="option">Gamma</div><div role="option">Delta</div></div></div></div></div></section>
<div class="other"><label>Outside input<input id="outside"></label><button id="parent">Parent action</button><span id="result"></span></div>
<section aria-label="Page feedback"><div class="rating"><button type="button">★</button><button type="button">★</button><button type="button">★</button><button type="button">★</button><button type="button">★</button></div><output id="preview">0</output><output id="votes">0</output></section>
<fieldset><legend>Delivery</legend><label><input type="radio" name="delivery" value="slow">Standard</label><label><input type="radio" name="delivery" value="fast">Express</label></fieldset>
<script>
for(const picker of document.querySelectorAll('.picker')){
 const panel=picker.querySelector('.panel');
 picker.addEventListener('click',event=>{if(!panel.contains(event.target))panel.style.display=panel.style.display==='block'?'none':'block'});
 picker.querySelector('input').addEventListener('input',event=>{for(const option of panel.querySelectorAll('[role=option]'))option.hidden=!option.textContent.toLowerCase().includes(event.target.value.toLowerCase())});
 for(const option of panel.querySelectorAll('[role=option]'))option.addEventListener('click',()=>{picker.firstElementChild.textContent=option.textContent;panel.style.display='none'});
}
document.querySelector('#parent').onclick=()=>document.querySelector('#result').textContent='parent executed';
let votes=0;const stars=[...document.querySelectorAll('.rating button')];
stars.forEach((button,i)=>{button.onmouseenter=()=>{stars.forEach((b,j)=>b.classList.toggle('active',j<=i));document.querySelector('#preview').textContent=String(i+1)};button.onmouseleave=()=>{stars.forEach(b=>b.classList.remove('active'));document.querySelector('#preview').textContent='0'};button.onclick=()=>document.querySelector('#votes').textContent=String(++votes)});
</script></html>
