<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>List identity fixtures</title><style>
body{font:16px system-ui;margin:32px}ul{padding:0;list-style:none}li{display:flex;gap:20px;align-items:center;padding:14px;border-bottom:1px solid #ddd}button{padding:8px 20px}#viewport{height:170px;overflow:auto;border:1px solid #bbb;width:500px}
</style></head><body>
<h1>List identity fixtures</h1><section aria-label="Orders"><div id="viewport"><ul id="orders" aria-label="Order records"></ul></div></section>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'keyed';
  const list = document.getElementById('orders');
  window.renderRecords = (records, reuse = false) => {
    const previous = [...list.children];
    const rows = records.map((record, index) => {
      const item = reuse && previous[index] || document.createElement('li');
      item.id = `virtual-slot-${index}`;
      if (mode !== 'semantic' && mode !== 'indistinguishable') item.dataset.rowKey = record;
      else delete item.dataset.rowKey;
      const title = mode === 'indistinguishable' ? '' : `Order ${record}`;
      if (!item.children.length) item.innerHTML = '<span></span><button data-testid="edit">Edit</button>' + (mode === 'duplicate' ? '<button data-testid="edit">Edit</button>' : '');
      item.querySelector('span').textContent = title;
      return item;
    });
    list.replaceChildren(...rows);
  };
  window.renderRecords(['A', 'B']);
</script></body></html>
