<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Observation lifecycle fixture</title></head>
<body>
  <h1>Observation lifecycle fixture</h1>
  <button id="temporary" onclick="rebuild(true)">Rebuild document</button>
  <button id="permanent" onclick="rebuild(false)">Remove document body</button>
  <button id="transition" onclick="location.href='capture.html?arrived=1'">Navigate</button>
  <input id="value" aria-label="Value" value="before">
  <script>
    window.actionCalls = 0;
    function rebuild(restore) {
      window.actionCalls++;
      const body = document.body;
      body.remove();
      window.restoreBody = () => { document.documentElement.append(body); document.querySelector('#value').value = 'after'; };
      if (restore) setTimeout(window.restoreBody, 180);
    }
  </script>
</body>
</html>
