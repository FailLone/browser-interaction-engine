<!doctype html><meta charset="utf-8"><title>Asynchronous content fixture</title>
<style>nav{padding:16px;width:340px}summary,a,button{display:block;margin:8px 0}aside{position:absolute;left:600px;top:20px;width:200px}dialog{z-index:10}</style>
<nav aria-label="Local information"><details id="menu"><summary>Information</summary><section id="result"></section></details></nav>
<aside><p>Outside quote <output id="quote">10</output></p></aside>
<script>
const menu=document.getElementById('menu'),result=document.getElementById('result'),quote=document.getElementById('quote');
const q=new URLSearchParams(location.search), scenario=q.get('scenario')||'delayed', delay=Number(q.get('delay')||450);
const events=[];window.fixtureEvents=events;const record=(type,data={})=>{const event={type,...data,ticks,at:performance.now()};events.push(event);fetch('/__event',{method:'POST',body:JSON.stringify(event),keepalive:true});};
let ticks=0;setInterval(()=>{quote.textContent=String(++ticks);},20);
const link=(id)=>{const a=document.createElement('a');a.textContent='Record '+id;a.href='/async-result/'+id;return a;};
if(scenario==='never'){
 const nav=document.createElement('nav');nav.setAttribute('aria-label','Independent');nav.append(link('independent'));document.body.append(nav);
}
if(scenario==='mixed'){
 const existing=document.createElement('button');existing.type='button';existing.setAttribute('role','tab');existing.textContent='Existing child';existing.setAttribute('aria-controls','result');existing.setAttribute('aria-expanded','false');
 menu.replaceWith(existing,result);existing.addEventListener('click',()=>{record('existing');existing.disabled=true;existing.setAttribute('aria-expanded','true');const pending=document.createElement('div');pending.setAttribute('aria-busy','true');result.append(pending);record('pending');setTimeout(()=>{pending.replaceWith(link('late'));record('child-added');},delay);});
}

let started=false;
menu.querySelector('summary').addEventListener('click',()=>{
 record('menu',{open:!menu.open});if(menu.open||started)return;started=true;
 const pending=document.createElement('div');pending.setAttribute(scenario==='live'?'aria-live':'aria-busy',scenario==='live'?'polite':'true');pending.textContent='Preparing information';result.append(pending);record('pending');
 if(scenario!=='never')setTimeout(()=>{pending.replaceWith(link('late'));record('child-added',{open:menu.open});},delay);
});
document.addEventListener('click',e=>{const a=e.target.closest('a');if(a)record('link',{href:a.href,label:a.textContent});},true);
</script>
