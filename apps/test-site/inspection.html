<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>Inspection fixture</title>
<style>
body { margin: 0; font: 16px sans-serif; } main { padding: 16px; } button { margin: 4px; }
.popup { position: absolute; left: 32px; top: 80px; width: 320px; background: white; border: 2px solid #555; z-index: 10; }
.long { height: 1400px; background: linear-gradient(#eee, #ccc); }
#child { position: fixed; left: 380px; top: 100px; width: 250px; z-index: 20; background: #ffc; border: 1px solid; }
#good .scroll { max-height: 260px; overflow-y: auto; }
[hidden] { display: none !important; }
</style></head><body><main>
<button id="openBad" aria-haspopup="dialog" aria-controls="bad" aria-expanded="false" onclick="openPopup('bad', this)">Open oversized popup</button>
<button id="openGood" aria-haspopup="dialog" aria-controls="good" aria-expanded="false" onclick="openPopup('good', this)">Open scrolling popup</button>
<button onclick="document.body.style.color = document.body.style.color === 'red' ? 'blue' : 'red'">Change color</button>
<p id="status">Original content</p><div id="preexisting"></div>
</main>
<div id="bad" class="popup" role="dialog" aria-label="Oversized popup" hidden>
<button onclick="closePopup('bad')">Close bad</button><button aria-haspopup="dialog" aria-controls="child" aria-expanded="false" onclick="openPopup('child', this)">Open child</button>
<div class="long">Content with no height limit</div></div>
<div id="good" class="popup" role="dialog" aria-label="Scrolling popup" hidden>
<button onclick="closePopup('good')">Close good</button><div class="scroll"><div class="long">Internal scrolling content</div></div></div>
<div id="child" role="dialog" aria-label="Child popup" hidden><button onclick="closePopup('child')">Close child</button>Portalled child</div>
<script>
function openPopup(id, opener) { document.getElementById(id).hidden = false; opener.setAttribute('aria-expanded', 'true'); }
function closePopup(id) { document.getElementById(id).hidden = true; document.querySelectorAll('[aria-controls="'+id+'"]').forEach(el => el.setAttribute('aria-expanded', 'false')); document.getElementById('status').textContent = 'Content changed after closing'; }
if (location.search.includes('preexisting')) document.getElementById('preexisting').style.height = '1800px';
if (location.search.includes('already-open')) openPopup('bad', document.getElementById('openBad'));
</script></body></html>
